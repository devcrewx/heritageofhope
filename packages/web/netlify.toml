[build]
  command = "npm run build"
  publish = "dist"

# Fallback to index.html for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Set environment variable for production API base URL
# Replace with your actual API server URL when available
[env.production]
  VITE_API_BASE_URL = "https://api.heritageofhope.org"
