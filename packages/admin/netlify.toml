[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_BASE = "https://heritageofhope-api.onrender.com"

[[redirects]]
  from = "/api/*"
  to = "https://heritageofhope-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
