steps:
  - id: api-build
    name: gcr.io/k8s-skaffold/pack
    entrypoint: pack
    args:
      - build
      - asia-south1-docker.pkg.dev/$PROJECT_ID/heritageofhope/api:$SHORT_SHA
      - --builder=gcr.io/buildpacks/builder:v1

  - id: admin-deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - heritageofhope-admin
      - --image=asia-south1-docker.pkg.dev/$PROJECT_ID/heritageofhope/admin:$SHORT_SHA
      - --region=asia-south1
      - --platform=managed
      - --allow-unauthenticated
      - --cpu=1
      - --memory=256Mi
      - --min-instances=0
      - --max-instances=3
      - --concurrency=80
      - --timeout=60

  - id: web-deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - heritageofhope-web
      - --image=asia-south1-docker.pkg.dev/$PROJECT_ID/heritageofhope/web:$SHORT_SHA
      - --region=asia-south1
      - --platform=managed
      - --allow-unauthenticated
      - --cpu=1
      - --memory=256Mi
      - --min-instances=0
      - --max-instances=3
      - --concurrency=80
      - --timeout=60

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
