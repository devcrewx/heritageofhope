
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
.wrap{padding:1rem 0}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.25rem}
.filter-btn{font-size:12px;padding:4px 12px;border-radius:999px;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-secondary);cursor:pointer;transition:all .15s}
.filter-btn.active{background:var(--color-background-info);color:var(--color-text-info);border-color:transparent}
.summary-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.5rem}
.s-card{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:.75rem 1rem}
.s-card .num{font-size:22px;font-weight:500;margin-bottom:2px}
.s-card .lbl{font-size:12px;color:var(--color-text-secondary)}
.s-card.red .num{color:var(--color-text-danger)}
.s-card.amber .num{color:var(--color-text-warning)}
.s-card.green .num{color:var(--color-text-success)}
.entry{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:1rem 1.25rem;margin-bottom:.75rem;background:var(--color-background-primary)}
.entry-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:.5rem}
.entry-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge{font-size:11px;padding:3px 9px;border-radius:999px;font-weight:500}
.badge.change{background:var(--color-background-danger);color:var(--color-text-danger)}
.badge.ok{background:var(--color-background-success);color:var(--color-text-success)}
.badge.minor{background:var(--color-background-warning);color:var(--color-text-warning)}
.page-tag{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--color-background-secondary);color:var(--color-text-secondary)}
.label{font-size:12px;color:var(--color-text-secondary);margin-bottom:3px;margin-top:.6rem}
.en-text{font-size:13px;color:var(--color-text-secondary);font-style:italic}
.bn-text{font-size:14px;color:var(--color-text-primary);line-height:1.6}
.suggested{font-size:14px;color:var(--color-text-success);line-height:1.6}
.reason{font-size:12px;color:var(--color-text-secondary);margin-top:.4rem;line-height:1.5}
.divider{height:0.5px;background:var(--color-border-tertiary);margin:.6rem 0}
.hidden{display:none}
</style>

<div class="wrap">
<h2 class="sr-only">Bengali text audit for Heritage of Hope Foundation website</h2>

<div class="summary-row">
  <div class="s-card red"><div class="num" id="cnt-change">0</div><div class="lbl">Change recommended</div></div>
  <div class="s-card amber"><div class="num" id="cnt-minor">0</div><div class="lbl">Minor suggestion</div></div>
  <div class="s-card green"><div class="num" id="cnt-ok">0</div><div class="lbl">Sounds natural</div></div>
</div>

<div class="filters">
  <button class="filter-btn active" onclick="filter('all')">All</button>
  <button class="filter-btn" onclick="filter('change')">Change recommended</button>
  <button class="filter-btn" onclick="filter('minor')">Minor suggestion</button>
  <button class="filter-btn" onclick="filter('ok')">Sounds natural</button>
</div>

<div id="list"></div>
</div>

function filter(type){
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  document.querySelectorAll('.entry').forEach(e=>{
    if(type==='all'||e.dataset.status===type) e.classList.remove('hidden');
    else e.classList.add('hidden');
  });
}

const list=document.getElementById('list');
let cChange=0,cMinor=0,cOk=0;

entries.forEach(e=>{
  if(e.status==='change')cChange++;
  else if(e.status==='minor')cMinor++;
  else cOk++;

  const div=document.createElement('div');
  div.className='entry';
  div.dataset.status=e.status;

  const badgeClass=e.status==='change'?'change':e.status==='minor'?'minor':'ok';
  const badgeText=e.status==='change'?'Change recommended':e.status==='minor'?'Minor suggestion':'Sounds natural';

  div.innerHTML=`
    <div class="entry-header">
      <div class="entry-meta">
        <span class="badge ${badgeClass}">${badgeText}</span>
        <span class="page-tag">${e.page}</span>
      </div>
    </div>
    <div class="label">English</div>
    <div class="en-text">${e.en}</div>
    <div class="label">Current Bengali</div>
    <div class="bn-text">${e.bn}</div>
    ${e.suggested?`<div class="divider"></div><div class="label">Suggested Bengali</div><div class="suggested">${e.suggested}</div>`:''}
    <div class="reason">${e.reason}</div>
  `;
  list.appendChild(div);
});

document.getElementById('cnt-change').textContent=cChange;
document.getElementById('cnt-minor').textContent=cMinor;
document.getElementById('cnt-ok').textContent=cOk;
</script>
