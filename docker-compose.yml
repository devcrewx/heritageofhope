# WARNING: This file is for LOCAL DEVELOPMENT ONLY.
# Do NOT deploy to production without changing ALL secrets.
# Use .env file (referenced below) for sensitive values.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-heritageofhope}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-heritageofhope}
      POSTGRES_DB: ${DB_NAME:-heritageofhope}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heritageofhope"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4010:4010"
    env_file:
      - packages/api/.env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-heritageofhope}:${DB_PASSWORD:-heritageofhope}@db:5432/${DB_NAME:-heritageofhope}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-in-production}
      JWT_EXPIRY: 7d
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174
      PORT: 4010
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: packages/admin/Dockerfile
      args:
        VITE_API_BASE: ""
    ports:
      - "5174:80"
    depends_on:
      - api

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
