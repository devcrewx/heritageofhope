services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: heritageofhope
      POSTGRES_PASSWORD: heritageofhope
      POSTGRES_DB: heritageofhope
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heritageofhope"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4010:4010"
    environment:
      DATABASE_URL: postgresql://heritageofhope:heritageofhope@db:5432/heritageofhope
      JWT_SECRET: dev-jwt-secret-change-in-production
      JWT_EXPIRY: 7d
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174
      PORT: 4010
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: packages/admin/Dockerfile
      args:
        VITE_API_BASE: ""
    ports:
      - "5174:80"
    depends_on:
      - api

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
