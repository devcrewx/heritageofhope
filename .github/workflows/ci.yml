name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
        working-directory: packages/web
      - run: npm run lint
        working-directory: packages/admin
      - run: npm run lint
        working-directory: packages/api
      - run: npm run test
        working-directory: packages/admin
      - run: npm run test
        working-directory: packages/web
      - run: npm run build
        working-directory: packages/web
      - run: npm run build
        working-directory: packages/admin

  a11y:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: e2e-tests
      - name: Install Playwright browsers
        run: npx playwright install chromium
        working-directory: e2e-tests
      - name: Run a11y audits
        run: npm run test:a11y
        working-directory: e2e-tests
        env:
          WEB_URL: https://web-peach-six-y2ufgnodmc.vercel.app
          ADMIN_URL: https://admin-nine-beige-85.vercel.app

  lighthouse:
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: e2e-tests
      - name: Run Lighthouse CI
        run: npx lhci autorun
        working-directory: e2e-tests
        env:
          LHCI_URLS: >-
            https://web-peach-six-y2ufgnodmc.vercel.app,
            https://web-peach-six-y2ufgnodmc.vercel.app/about,
            https://web-peach-six-y2ufgnodmc.vercel.app/programs,
            https://web-peach-six-y2ufgnodmc.vercel.app/contact,
            https://admin-nine-beige-85.vercel.app/login
