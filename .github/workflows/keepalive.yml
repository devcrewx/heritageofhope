name: Keep Render warm
on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render API health endpoint
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            https://heritageofhope-api.onrender.com/api/health
