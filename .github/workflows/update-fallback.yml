name: Update content fallback
on:
  schedule:
    - cron: '0 2 * * *'
  repository_dispatch:
    types: [sync-fallback]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch content snapshot
        run: |
          curl -s https://heritageofhope-api.onrender.com/api/content \
            > packages/web/public/content-fallback.json
      - name: Generate content.js fallback
        run: |
          python3 .github/workflows/gen-content-js.py
      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add packages/web/public/content-fallback.json packages/web/src/content.js
          git diff --cached --quiet || {
            git checkout -b auto/fallback-$(date +%s)
            git commit -m "chore: update content fallback snapshot"
            git push origin HEAD
            gh pr create --fill --base main --head auto/fallback-$(date +%s) --label automated
          }
