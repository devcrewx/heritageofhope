<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heritage of Hope Foundation</title>
  </head>
  <body>
    <div id="root"></div>
    <form name="contact-form" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact-form" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" />
      <input name="subject" />
      <textarea name="message"></textarea>
    </form>
    <form name="volunteer-form" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="volunteer-form" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" />
      <input name="phone" />
      <input name="area_of_interest" />
      <input name="availability" />
      <textarea name="message"></textarea>
    </form>
    <form name="partner-form" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="partner-form" />
      <input name="bot-field" />
      <input name="organization_name" />
      <input name="contact_person" />
      <input name="email" />
      <input name="phone" />
      <input name="partnership_type" />
      <textarea name="message"></textarea>
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
